services:
  - type: web
    name: resumeflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resumeflow-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_FILES_PER_BATCH
        value: "20"
      - key: MAX_ZIP_UNCOMPRESSED_MB
        value: "100"

databases:
  - name: resumeflow-db
    plan: free
    databaseName: resumeflow
    user: resumeflow